<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>Tabaco — Acceso</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #111;
      --surface: #1c1c1c;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #c9a96e;
      --accent-dim: #8a7350;
      --error: #a05050;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 22rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.5rem;
    }
    h1 {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }
    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0.5rem 0 1.75rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      outline: none;
    }
    input:focus { border-color: var(--accent-dim); }
    button {
      width: 100%;
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.9rem;
      margin-top: 0.5rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { opacity: 0.85; }
    button:disabled { opacity: 0.5; }
    .error {
      color: var(--error);
      font-size: 0.8rem;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tabaco</h1>
    <p class="subtitle">Ingresá para continuar</p>
    <form id="form">
      <label for="user">Usuario</label>
      <input id="user" name="user" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Entrar</button>
    </form>
    <p class="error" id="error"></p>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('error');
      err.textContent = '';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user: document.getElementById('user').value,
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) {
          location.href = '/';
          return;
        }
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || 'Error al ingresar';
      } catch {
        err.textContent = 'Sin conexión al servidor';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
